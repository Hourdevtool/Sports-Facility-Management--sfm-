services:
  mysql:
    image: mysql:8.0
    container_name: sfm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sfm_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sfm-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sfm-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - sfm-network

volumes:
  mysql_data:

networks:
  sfm-network:
    driver: bridge
